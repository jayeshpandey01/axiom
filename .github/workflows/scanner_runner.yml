name: Automated Cloud Scan Runner

on:
  schedule:
    - cron: '*/5 * * * *' # Automatically runs every 5 minutes in GitHub's Cloud (24/7)
  repository_dispatch:
    types: [execute-scan] # Triggered instantly via webhook when a scan is requested
  workflow_dispatch:      # Manual trigger button in GitHub Actions tab

concurrency:
  group: cloud-scanner-agent
  cancel-in-progress: false

jobs:
  run-scanner:
    name: Process Queued Scans (24/7 Cloud Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Scanner Binaries (httpx, nuclei, ffuf, nmap, masscan)
        run: |
          sudo apt-get update && sudo apt-get install -y nmap masscan
          # ProjectDiscovery httpx
          curl -sL https://github.com/projectdiscovery/httpx/releases/download/v1.6.9/httpx_1.6.9_linux_amd64.zip -o httpx.zip
          unzip -q -o httpx.zip httpx && sudo mv httpx /usr/local/bin/ && rm -f httpx.zip
          # ProjectDiscovery nuclei
          curl -sL https://github.com/projectdiscovery/nuclei/releases/download/v3.3.7/nuclei_3.3.7_linux_amd64.zip -o nuclei.zip
          unzip -q -o nuclei.zip nuclei && sudo mv nuclei /usr/local/bin/ && rm -f nuclei.zip
          # FFUF
          curl -sL https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz -o ffuf.tar.gz
          tar -xzf ffuf.tar.gz ffuf && sudo mv ffuf /usr/local/bin/ && rm -f ffuf.tar.gz
          # Initialize nuclei templates non-interactively
          nuclei -ut -duc
          # Verify versions
          httpx -version
          nuclei -version
          ffuf -V
          nmap --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-controller.txt

      - name: Execute Controller Agent (Batch Mode)
        env:
          CONTROLLER_API_ENDPOINT: ${{ secrets.CONTROLLER_API_ENDPOINT || 'https://axiom-xjkc.onrender.com' }}
          CONTROLLER_SHARED_SECRET: ${{ secrets.CONTROLLER_SHARED_SECRET }}
          RESULT_ENCRYPTION_KEY: ${{ secrets.RESULT_ENCRYPTION_KEY }}
          LOG_LEVEL: INFO
        run: |
          echo "Starting Controller Cloud Runner against: $CONTROLLER_API_ENDPOINT"
          python -m controller.agent --once --idle-timeout 10 --interval 3
